name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q ./*.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: site_inspect
        run: flutter create --platforms=android --project-name site_inspect --org com.siteinspect .

      - name: Add permissions and app name
        working-directory: site_inspect
        run: python3 tools/patch_manifest.py

      - name: Raise compileSdk for all plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compile-sdk.gradle <<'EOF'
          gradle.allprojects { p ->
              p.afterEvaluate {
                  def ext = p.extensions.findByName('android')
                  if (ext != null && p.plugins.hasPlugin('com.android.library')) {
                      try {
                          ext.compileSdk = 36
                      } catch (Throwable t) {
                          try {
                              ext.compileSdkVersion(36)
                          } catch (Throwable t2) {
                              println "compileSdk override skipped for ${p.name}"
                          }
                      }
                  }
              }
          }
          EOF

      - name: Get packages
        working-directory: site_inspect
        run: flutter pub get

      - name: Build APK
        working-directory: site_inspect
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: site-inspect-apk
          path: site_inspect/build/app/outputs/flutter-apk/app-release.apk
